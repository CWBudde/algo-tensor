# treefmt configuration for algo-tensor
# Multi-language code formatting

[global]
excludes = [
    # Git and version control
    "**/.gitignore",
    "**/.git/**",

    # Go module files (managed by go tooling)
    "go.sum",
    "go.mod",

    # Documentation and text files
    "**/*.txt",
    "CHANGELOG.md",
    "LICENSE",

    # Build artifacts
    "bin/**",
    "dist/**",
    "coverage.out",
    "coverage.html",

    # Web demo: dependencies, build output, the lockfile and Go's wasm_exec.js
    "web/node_modules/**",
    "web/dist/**",
    "web/package-lock.json",
    "web/public/wasm_exec.js",
]

# Go formatter - simple and strict
[formatter.gofumpt]
command = "gofumpt"
options = ["-w"]
includes = ["*.go"]

# Go import organizer - runs after gofumpt
[formatter.gci]
command = "gci"
options = ["write"]
includes = ["*.go"]
priority = 1

# Shell script checker
[formatter.shellcheck]
command = "shellcheck"
includes = ["*.sh"]

# Shell script formatter - runs after shellcheck
[formatter.shfmt]
command = "shfmt"
options = ["-s", "-w"]
includes = ["*.sh"]
priority = 1

# Markdown, YAML, JSON formatter, and the web demo's TypeScript, CSS and HTML
[formatter.prettier]
command = "prettier"
options = ["-w"]
includes = [
    "*.md",
    "*.yaml",
    "*.yml",
    "*.json",
    "web/**/*.ts",
    "web/**/*.tsx",
    "web/**/*.css",
    "web/**/*.html",
]
