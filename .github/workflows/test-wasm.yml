name: test-wasm

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup just
        uses: extractions/setup-just@v4

      - name: Build for js/wasm
        run: just build-wasm
